name: Squash vuln-list repo

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 1 * *'

concurrency:
  group: vuln-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: false
permissions: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    # vuln-list carries tens of GB of history, so a clone-and-rewrite squash
    # cannot finish: the rewritten commits share no ancestry with main, and
    # pushing them re-sends every object they reference, far past GitHub's
    # 2 GB push limit. The current tree is already on GitHub, so make a
    # parentless commit from it through the API and move main onto it;
    # nothing is downloaded. A fetcher push that lands between the tip check
    # and the ref update is dropped, which the next scheduled run restores.
    - name: Squash main to a single commit
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.ACCESS_TOKEN }}
        REPO: ${{ github.repository_owner }}/vuln-list
      run: |
        tip=$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)
        tree=$(gh api "repos/${REPO}/git/commits/${tip}" --jq .tree.sha)
        squashed=$(jq -n --arg tree "${tree}" --arg message "Squash vuln-list history at ${tip}" \
          '{tree: $tree, parents: [], message: $message, author: {name: "GitHub Action", email: "action@github.com"}}' \
          | gh api -X POST "repos/${REPO}/git/commits" --input - --jq .sha)
        if [[ "$(gh api "repos/${REPO}/git/ref/heads/main" --jq .object.sha)" != "${tip}" ]]; then
          echo "main moved past ${tip} while squashing; rerun the workflow"
          exit 1
        fi
        gh api -X PATCH "repos/${REPO}/git/refs/heads/main" -f sha="${squashed}" -F force=true --jq .object.sha
