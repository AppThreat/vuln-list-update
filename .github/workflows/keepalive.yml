name: Keep scheduled workflows enabled
on:
  schedule:
  - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: vuln-${{ github.workflow }}
  cancel-in-progress: false
permissions:
  actions: write
jobs:
  keepalive:
    name: Keep scheduled workflows enabled
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    # GitHub disables scheduled workflows after 60 days without repository
    # activity, and this repo's jobs commit to AppThreat/vuln-list, not here.
    # Re-enabling each scheduled workflow through the API keeps them alive
    # without the keepalive commits, which main's required "vet, gofmt and
    # test" check would now reject.
    - name: Re-enable the scheduled workflows
      shell: bash
      run: |
        for workflow in update.yml nvd.yml squash.yml keepalive.yml; do
          echo "Enabling ${workflow}"
          gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
        done
